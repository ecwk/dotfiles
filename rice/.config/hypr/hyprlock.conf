# Simple lockscreen: blurred desktop, clock and password prompt.
# Configuration matched to Hyprlock 0.9.6.
$font = Monospace
# Bright text with dark shadows stays readable over the blurred desktop.
$lock_text = rgb(f4f4f4)
$lock_shadow = rgba(000000dd)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_size = 8
    blur_passes = 3
    brightness = 0.65
}

# Arch logo supplied by the installed system artwork package.
image {
    monitor =
    path = /usr/share/pixmaps/archlinux-logo.png
    size = 120
    rounding = 0
    border_size = 0
    position = 0, 330
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $lock_text
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $lock_shadow
    font_size = 48
    font_family = $font
    position = 0, 188
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%Y-%m-%d / %a"
    color = $lock_text
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $lock_shadow
    font_size = 18
    font_family = $font
    position = 0, 128
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER@arch ~
    color = $lock_text
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $lock_shadow
    font_size = 18
    font_family = $font
    position = 0, 38
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 450, 84
    outline_thickness = 1
    outer_color = rgba(80889040)
    inner_color = rgba(181818bb)
    font_color = rgb(f4f4f4)
    check_color = rgba(9ac7aaff)
    fail_color = rgba(e88b8bff)
    capslock_color = rgba(e8c78bff)
    font_family = $font
    rounding = 24
    dots_center = false
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
# Hyprlock centers placeholders; invisible monospace padding puts text at the left inset.
    placeholder_text = <span foreground="gainsboro" size="16128">Password<span alpha="1">____________________</span></span>
    fail_text = $PAMFAIL
    position = 0, -45
    halign = center
    valign = center
}
