# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal --gtk-single-instance=true --quit-after-last-window-closed=false --initial-window=false
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
#exec-once = waybar
# Hyprpaper is started by the enabled hyprpaper.service; do not launch a second instance.
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- hyprpm reload -n
exec-once = uwsm app -- fcitx5 -d 
exec-once = uwsm app -- ~/.local/bin/hypr-chrome-resurrect daemon
exec-once = EMOJI_FONT="Apple Color Emoji" uwsm app -- vicinae server
# exec-once = ags run ~/.config/ags/ecwk/app.ts

# Restore the wallpaper saved by Waypaper after Hyprpaper is ready.
exec-once = uwsm app -- ~/.local/bin/walltheme restore
