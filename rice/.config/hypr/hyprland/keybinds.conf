$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = SUPER, T, exec, $terminal --gtk-single-instance=true
bind = SUPER, Q, killactive,
bind = SUPER, RETURN, exec, vicinae vicinae://toggle
bind = SUPER, period, exec, vicinae vicinae://extensions/vicinae/core/search-emojis
bind = SUPER_CTRL, period, exec, vicinae vicinae://extensions/vicinae/core/search-gifs

# Windows-style region screenshot to clipboard
bind = SUPER SHIFT, S, exec, env PATH=/home/ecwk/.local/bin:/usr/bin /home/ecwk/.local/bin/hyprshot -m region --clipboard-only --freeze

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, r~1
bind = $mainMod, 2, workspace, r~2
bind = $mainMod, 3, workspace, r~3
bind = $mainMod, 4, workspace, r~4
bind = $mainMod, 5, workspace, r~5
bind = $mainMod, 6, workspace, r~6
bind = $mainMod, 7, workspace, r~7
bind = $mainMod, 8, workspace, r~8
bind = $mainMod, 9, workspace, r~9
bind = $mainMod, 0, workspace, r~10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER_SHIFT, 1, movetoworkspacesilent, r~1
bind = SUPER_SHIFT, 2, movetoworkspacesilent, r~2
bind = SUPER_SHIFT, 3, movetoworkspacesilent, r~3
bind = SUPER_SHIFT, 4, movetoworkspacesilent, r~4
bind = SUPER_SHIFT, 5, movetoworkspacesilent, r~5
bind = SUPER_SHIFT, 6, movetoworkspacesilent, r~6
bind = SUPER_SHIFT, 7, movetoworkspacesilent, r~7
bind = SUPER_SHIFT, 8, movetoworkspacesilent, r~8
bind = SUPER_SHIFT, 9, movetoworkspacesilent, r~9
bind = SUPER_SHIFT, 0, movetoworkspacesilent, r~10

# Example special workspace (scratchpad)
bind = SUPER, SPACE, togglespecialworkspace, magic
bind = SUPER SHIFT, SPACE, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Toggle the Codex/ChatGPT special workspace.
bind = SUPER, C, togglespecialworkspace, codex
bind = SUPER SHIFT, C, movetoworkspacesilent, special:codex

# Toggle media and notes special workspaces; Shift moves the active window.
bind = SUPER, M, togglespecialworkspace, media
bind = SUPER SHIFT, M, movetoworkspacesilent, special:media
bind = SUPER, N, togglespecialworkspace, notes
bind = SUPER SHIFT, N, movetoworkspacesilent, special:notes

# Show desktop; press again to restore windows and focus.
bind = SUPER, D, exec, /usr/bin/python3 ~/.config/hypr/hyprland/scripts/show-desktop.py
