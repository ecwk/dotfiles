# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
        name = "Ignore maximize requests",
        match:class = ".*'"

        suppress_event = "maximize"
}


# Fix some dragging issues with XWayland
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule {
        name = "Fix dragging issues with XWayland",
        match:class = "^$",
        match:title = "^$",
        match:xwayland = true

        no_focus = "on"
        float = "on"
        fullscreen = "on"
        pin = "on"
}

# Float the Bitwarden Chrome extension pop-out (all Chrome profiles).
windowrule {
        name = Float Bitwarden Chrome extension
        match:class = ^chrome-nngceckbapebfimnlniiiahkandclblb-.*$

        float = on
}

# Open Codex/ChatGPT windows in their dedicated special workspace.
windowrule {
        name = Codex special workspace
        match:class = ^chatgpt$

        workspace = special:codex silent
}

# Open Files (Nautilus) as a floating window by default.
windowrule {
        name = Float Nautilus
        match:class = ^org\.gnome\.Nautilus$

        float = on
}
