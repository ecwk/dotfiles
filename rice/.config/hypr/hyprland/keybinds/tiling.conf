# Move Focus
bindd = SUPER, h, "Focus window left", movefocus, l
bindd = SUPER, l, "Focus window right", movefocus, r
bindd = SUPER, k, "Focus window up", movefocus, u
bindd = SUPER, j, "Focus window down", movefocus, d

# Move Window
bindd = SUPER SHIFT, h, "Move window left", movewindoworgroup, l
bindd = SUPER SHIFT, l, "Move window right", movewindoworgroup, r
bindd = SUPER SHIFT, k, "Move window up", movewindoworgroup, u
bindd = SUPER SHIFT, j, "Move window down", movewindoworgroup, d

# Resize Window
bindde = SUPER CTRL, h, "Resize window left", resizeactive, -10 0
bindde = SUPER CTRL, l, "Resize window right", resizeactive, 10 0
bindde = SUPER CTRL, k, "Resize window up", resizeactive, 0 -10
bindde = SUPER CTRL, j, "Resize window down", resizeactive, 0 10

# Toggle Window States
bindd = SUPER SHIFT CTRL, F, "Toggle floating", togglefloating
bindd = SUPER, F, "Toggle fullscreen", fullscreen, 0
bindd = SUPER SHIFT, F, "Toggle padded fullscreen", fullscreen, 1

# Group Controls
bindd = SUPER SHIFT, G, "Toggle group", togglegroup
bindd = SUPER SHIFT CTRL, L, "Toggle group lock", lockgroups, toggle
bindd = SUPER, TAB, "Change group forward", changegroupactive, f
bindd = SUPER SHIFT, TAB, "Change group backward", changegroupactive, b
bindd = SUPER SHIFT, period, "Shift group forward", movegroupwindow, f
bindd = SUPER SHIFT, comma, "Shift group backward", movegroupwindow, b

bindd = SUPER, O, "Toggle game", togglespecialworkspace, game
bindd = SUPER SHIFT, O, "Move game", movetoworkspace, special:game

# Hyprspace
bindd = SUPER, grave, "Toggle Hyprspace overview", overview:toggle
