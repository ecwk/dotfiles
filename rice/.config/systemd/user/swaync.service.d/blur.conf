[Service]
# GTK's empty client blur region overrides Hyprland layer blur rules.
# Let Hyprland control notification blur instead.
Environment=GDK_WAYLAND_DISABLE=ext_background_effect_manager_v1
# Keep notifications from opening or repeatedly waking the discrete GPU.
# Hyprland still applies the notification blur with its own renderer.
Environment=GSK_RENDERER=cairo
Environment=GDK_DISABLE=gl,vulkan
